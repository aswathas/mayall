  // ── easing: the product token cubic-bezier(0.16, 1, 0.3, 1) ──────────────
  function bezier(x1, y1, x2, y2) {
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
        const dx = 3 * (1 - t) * (1 - t) * x1 + 6 * (1 - t) * t * (x2 - x1) + 3 * t * t * (1 - x2);
        if (Math.abs(cx - x) < 1e-6) break;
        t -= (cx - x) / (dx || 1e-6);
        if (t < 0) t = 0;
        if (t > 1) t = 1;
      }
      return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
    };
  }
  const EASE = bezier(0.16, 1, 0.3, 1);

  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, p) => a + (b - a) * p;

  // ── text helpers ─────────────────────────────────────────────────────────
  function setFont(size, weight, family) {
    ctx.font = weight + ' ' + size + 'px ' + family;
  }
  function fill(str, x, y, color, align) {
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(str, x, y);
    ctx.textAlign = 'left';
  }
  function body(str, x, y, size, color, weight, family, align) {
    setFont(size, weight || 400, family || SANS);
    fill(str, x, y, color, align);
  }
  function micro(str, x, y, color, align, size) {
    const fs = size || 11;
    setFont(fs, 500, MONO);
    ctx.fillStyle = color;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    const chars = Array.from(str.toUpperCase());
    const track = 0.18 * fs;
    let widths = chars.map((ch) => ctx.measureText(ch).width);
    let total = widths.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
    let cx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
    for (let i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], cx, y);
      cx += widths[i] + track;
    }
    return total;
  }
  function trackedCase(str, x, y, size, weight, family, trackPx, color, align) {
    setFont(size, weight, family);
    ctx.fillStyle = color;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    const chars = Array.from(str);
    const widths = chars.map((ch) => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + trackPx * (chars.length - 1);
    let cx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
    for (let i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], cx, y);
      cx += widths[i] + trackPx;
    }
    return total;
  }
  function wrap(str, maxW, size, weight, family) {
    setFont(size, weight || 400, family || SANS);
    const words = str.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }
  function fitText(str, maxW, size, weight, family) {
    setFont(size, weight || 400, family || MONO);
    if (ctx.measureText(str).width <= maxW) return str;
    let lo = 0, hi = str.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (ctx.measureText(str.slice(0, mid) + '…').width <= maxW) lo = mid;
      else hi = mid - 1;
    }
    return str.slice(0, lo) + '…';
  }
  const fmt = (n) => n.toLocaleString('en-US');

  // ── shapes ───────────────────────────────────────────────────────────────
  function roundPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.arcTo(x + w, y, x + w, y + rr, rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
    ctx.lineTo(x + rr, y + h);
    ctx.arcTo(x, y + h, x, y + h - rr, rr);
    ctx.lineTo(x, y + rr);
    ctx.arcTo(x, y, x + rr, y, rr);
    ctx.closePath();
  }
  function panel(x, y, w, h) {
    roundPath(x, y, w, h, 14);
    ctx.fillStyle = COL.panel;
    ctx.fill();
    ctx.strokeStyle = COL.edge;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  function hairline(x, y, w, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color || COL.edge;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), 1);
    ctx.restore();
  }
  function chip(x, y, label, color, border, bg) {
    setFont(10.5, 500, MONO);
    const tw = ctx.measureText(label.toUpperCase()).width;
    const track = 1.4;
    const w = tw + track * (label.length - 1) + 20;
    const h = 22;
    roundPath(x, y, w, h, 11);
    if (bg) { ctx.fillStyle = bg; ctx.fill(); }
    ctx.strokeStyle = border || COL.edge;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = color;
    let cx = x + 10;
    const chars = Array.from(label.toUpperCase());
    for (const ch of chars) {
      ctx.fillText(ch, cx, y + 15);
      cx += ctx.measureText(ch).width + track;
    }
    return w;
  }
  function shotState(t, start, end, fadeIn, fadeOut, lift) {
    // Hard cut at the shot boundary (no dip-to-black), with the incoming shot
    // lifting into place. Every frame therefore carries content.
    const fi = fadeIn || 0.16;
    const inShot = t >= start && (t < end || end >= 26);
    const pIn = EASE(prog(t, start, fi));
    const dy = (1 - pIn) * (lift == null ? 26 : lift);
    return { a: inShot ? 1 : 0, dy: dy };
  }

  // ── ground ───────────────────────────────────────────────────────────────
  function ground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);

    g.addColorStop(0.42, '#090607');
    g.addColorStop(1, '#070506');

    ctx.save();
    ctx.strokeStyle = 'rgba(255,237,237,0.022)';

      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, H);

      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);

  const TREE_ROWS = [
    { d: 0, g: '', label: 'ReentrancyExploitTest.testExploit', gas: '2,098,601' },

  const WITHDRAW_GAS = ['110,836', '80,999', '71,062', '61,125', '51,188', '41,251', '31,314'];

  // ── SHOT 1 · HOOK 0.0–2.2 ────────────────────────────────────────────────
  function shotHook(t) {
    const s = shotState(t, 0, 2.2, 0.15, 0.18, 26);
    if (s.a <= 0) return;
    ctx.save();
    ctx.globalAlpha = s.a;
    ctx.translate(0, s.dy);

    // corner ticks (present from frame 0 so the reel never opens on black)
    const len = 18;
    ctx.strokeStyle = COL.edgeStrong;
    ctx.lineWidth = 1;
    const corners = [
      [MX, MY, 1, 1], [W - MX, MY, -1, 1],
      [MX, H - MY, 1, -1], [W - MX, H - MY, -1, -1]
    ];

      ctx.moveTo(x, y + sy * len);
      ctx.lineTo(x, y);
      ctx.lineTo(x + sx * len, y);
      ctx.stroke();

    micro('EVIDENCE · TRACE LINE', MX, 300, COL.faint);
    micro('LAB-REENTRANCY', W - MX, 300, COL.faint, 'right');
    micro('REENTRANCYVAULT', MX, 340, COL.dim);

    const line = '├─ [110836] ReentrancyVault::withdraw()';

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillText(line.slice(0, n), MX, 388);

    const lp = EASE(prog(t, 0.9, 0.3));

    const vp = EASE(prog(t, 0.9, 0.55));

    micro('RAW TRACE', 120, 214, COL.faint);
    micro('PARSED CALL TREE', 1004, 214, COL.faint);
    micro('DEPTH = COLUMN / 4', 1800, 214, COL.faint, 'right');

    // ── left: scrolling real trace ──
    const contentL = 118, contentR = 912, contentTop = 242, contentBottom = 944;
    const rowH = 21, fontSize = 12.5;
    let attackIdx = 0;
    for (let i = 0; i < TRACE.length; i++) {

    }

      if (y < contentTop - rowH || y > contentBottom) continue;

    if (hp > 0) {
      ctx.globalAlpha = s.a * hp;
      body('Local Foundry simulation. Not mainnet evidence.', W / 2, 700, 30, COL.dim, 400, SANS, 'center');
    }

    const rp2 = EASE(prog(t, 24.2, 0.5));
    if (rp2 > 0) {
      ctx.globalAlpha = s.a * rp2;
      setFont(13, 400, MONO);
      ctx.fillStyle = COL.faint;
      ctx.textAlign = 'center';
      ctx.fillText('16 public incidents · $2.39B tracked · 10 detectors', W / 2, 748);
      ctx.textAlign = 'left';
    }

    ctx.restore();
  }

  // ── frame ────────────────────────────────────────────────────────────────
  function renderAt(t) {
    const time = Math.max(0, Math.min(26, Number(t) || 0));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    ground();
    shotHook(time);
    shotTrace(time);
    shotRecursion(time);
    shotDetector(time);
    shotEvidence(time);
    shotProduct(time);
  }

  window.renderAt = renderAt;

  // First paint at t=0 so a screenshot can never be blank while fonts load.
  renderAt(0);

  const fontFaces = [
    '400 16px "Familjen Grotesk"',
    '500 16px "Familjen Grotesk"',
    '600 16px "Familjen Grotesk"',
    '700 16px "Familjen Grotesk"',
    '300 16px "Public Sans"',
    '400 16px "Public Sans"',
    '500 16px "Public Sans"',
    '600 16px "Public Sans"',
    '400 16px "JetBrains Mono"',
    '500 16px "JetBrains Mono"',
    '600 16px "JetBrains Mono"',
    '700 16px "JetBrains Mono"'
  ];

  (async () => {
    try {
      await Promise.all(fontFaces.map((f) => document.fonts.load(f)));
      await document.fonts.ready;
    } catch (e) {
      // A local fallback stack is declared in every font string.
    }
    window.__fontStatus = {
      display: document.fonts.check('600 16px "Familjen Grotesk"'),
      body: document.fonts.check('400 16px "Public Sans"'),
      mono: document.fonts.check('500 16px "JetBrains Mono"')
    };
    renderAt(0);

    // rAF preview loop, reads performance.now() (virtual clock during render).
    const started = performance.now();
    window.__previewQueued = true;
    function loop() {
      const seconds = ((performance.now() - started) / 1000) % 26;
      renderAt(seconds);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
