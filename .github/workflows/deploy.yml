name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the workspace
        run: npm run typecheck

      - name: Explain the narrative fallback
        run: |
          echo "MINIMAX_API_KEY is not configured for this workflow."
          echo "The AI narrative layer therefore falls back to its deterministic generator."
          echo "The static site never describes that fallback as an AI-authored report."

      - name: Build the static export
        run: npm run build:static
        env:
          MAYALL_BASE_PATH: /mayall

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-export

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
